[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "open-modality-trust-core"
version = "0.1.0"
readme = "README.md"
license-files = ["LICENSE"]
description = "Experimental scoped evidence and transactional authorization reference"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<51"]
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
