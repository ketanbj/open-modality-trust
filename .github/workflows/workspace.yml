name: Workspace integrity and local protocol validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: make check-docs PYTHON=python3
      - run: python3 scripts/check_workspace.py --require-checkouts
      - run: python -m pip install -e core -e modalities/openast -e modalities/openatt pytest ruff build
      - run: ruff check core/src core/tests scripts
      - run: ruff format --check core/src core/tests scripts
      - run: pytest -q core/tests modalities/openast/tests modalities/openatt/tests
      - run: python modalities/openast/scripts/verify_evidence.py
      - run: python modalities/openatt/scripts/verify_evidence.py
      - run: python -m openast demo --output output/ci-sight
      - run: python -m openatt demo --output output/ci-tactile
      - run: python -m build core
